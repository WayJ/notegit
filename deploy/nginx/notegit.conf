# Notegit 反向代理站点模板（E9 D55：部署物料入版）
#
# 用法：按实际域名/证书路径修改后置于 /etc/nginx/sites-available/notegit，
# 软链到 sites-enabled/ 并 reload。**应用侧必须配套显式设置可信代理白名单**：
#   NOTEGIT_TRUST_PROXY=127.0.0.1        # 反代与 Notegit 同机时
# 否则 X-Forwarded-Proto 不参与判定——TLS 终结后浏览器 https Origin 会被
# CSRF 判异源，全站写操作 403（api.md §1 CSRF 机制；E9 D53）。
#
# 会话 cookie 安全：本模板为 TLS 形态，应用保持默认（NOTEGIT_COOKIE_SECURE
# 未设置即开）。NOTEGIT_COOKIE_SECURE=0 仅供纯 HTTP 本地/内网试用，禁生产。

server {
    listen 80;
    server_name notegit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name notegit.example.com;

    # 证书由部署方提供与管控（identity §6.1 K3：实例外流程）
    # ssl_certificate     /etc/letsencrypt/live/notegit.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/notegit.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Git Smart HTTP 大包双向流式：关闭请求体缓冲、放宽超时
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
